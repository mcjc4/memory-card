<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高考学习目标管理台</title>
<style>
  :root{
    --bg:#f5f6fb; --surface:#ffffff; --surface-2:#fafbff;
    --text:#1f2430; --muted:#6b7280; --line:#e7e9f2;
    --primary:#7c5cff; --primary-2:#a78bfa; --primary-grad:linear-gradient(135deg,#7c5cff,#a78bfa);
    --green:#16a34a; --green-bg:#e7f8ee; --red:#e23b3b; --red-bg:#fdeaea; --amber:#e08a00; --amber-bg:#fff4e0;
    --shadow:0 6px 22px rgba(40,40,80,.08); --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  }
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}
  svg{display:block}
  .ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ico-sm{width:16px;height:16px}
  .btn{border:none;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.15s}
  .btn.primary{background:var(--primary-grad);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.35)}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:var(--red);color:#fff}
  .btn.block{width:100%}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
  .hint{color:var(--muted);font-size:12px;font-weight:500}
  .muted{color:var(--muted)}

  /* ===== Layout / Nav ===== */
  .nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);
       border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .nav button{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;
       align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;border-radius:12px}
  .nav button .ico{width:22px;height:22px}
  .nav button.active{color:var(--primary)}
  .nav button.active .ico{stroke:var(--primary)}
  .content{padding:14px 14px 92px}
  .topbar{display:none}

  @media(min-width:600px){
    .nav{top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--line)}
    .content{padding:76px 22px 28px}
  }
  @media(min-width:1024px){
    .nav{position:fixed;top:0;left:0;bottom:0;width:228px;flex-direction:column;
         align-items:stretch;justify-content:flex-start;gap:4px;padding:22px 14px;border-bottom:none;
         border-right:1px solid var(--line)}
    .nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;
         margin-bottom:18px;padding:0 8px;color:var(--text)}
    .nav .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--primary-grad);
         display:flex;align-items:center;justify-content:center;color:#fff}
    .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:12px 14px}
    .nav button .ico{width:20px;height:20px}
    .content{margin-left:228px;padding:28px 30px 40px;max-width:1280px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .topbar h1{font-size:22px;margin:0}
    .grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
    .grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  }

  /* ===== Cards ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px;box-shadow:var(--shadow)}
  .gk-line{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .gk-num{display:inline-block;font-size:48px;font-weight:900;line-height:1;min-width:1.2em;text-align:center;background:linear-gradient(135deg,var(--primary),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .date-input{font-size:15px;font-weight:600;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
  .date-input:focus{outline:none;border-color:var(--primary)}
  .goal-card{position:relative;overflow:hidden}
  .goal-card .accent{position:absolute;top:0;left:0;width:5px;height:100%}
  .goal-card .gtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .goal-card h3{margin:0 0 2px;font-size:17px}
  .goal-card .unit{color:var(--muted);font-size:13px}

  /* today card redesign */
  .today-card{padding:0}
  .today-card .gc-titlebar{position:relative;display:flex;align-items:center;justify-content:center;padding:8px 16px;color:#fff;text-align:center;min-height:32px;overflow:hidden}
  .today-card .gc-titlebar .gc-titlebar-bg{position:absolute;inset:0;opacity:.45;filter:saturate(.55);z-index:0}
  .today-card .gc-titlebar .gc-title-center{position:relative;z-index:1}
  .today-card .gc-titlebar .gc-title-center h3{margin:0;font-size:15px;font-weight:800;color:#fff;line-height:1.25}
  .today-card .gc-body{padding:14px 16px;background:#f9f8ff}
  .today-card .gc-body .target-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .today-card .gc-body .target-row:last-of-type{border-bottom:none;padding-bottom:0}
  .today-card .gc-body .target-row:first-child{padding-top:0}
  .today-card .gc-body .add-task-btn{margin-top:10px;width:100%;justify-content:flex-start;color:var(--muted);border:1px dashed var(--line);background:transparent}
  .today-card .gc-body .add-task-btn:hover{color:var(--primary);border-color:var(--primary)}
  .today-card .gc-body .today-target{flex:1;min-width:0}
  .today-card .gc-body .today-target .target-name{font-size:17px;font-weight:700;color:var(--text);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .today-card .gc-body .today-target .target-meta{color:var(--muted);font-size:12px;margin-top:2px}
  .today-card .gc-body .today-target .target-meta .wm{color:var(--red);font-weight:700}
  .today-card .gc-body .suggest-side{text-align:right;flex:0 0 auto;margin-left:auto}
  .today-card .gc-body .suggest-side .v{font-size:22px;font-weight:800;color:var(--primary)}
  .today-card .gc-main{padding:0 16px 16px}
  .circle-check{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid currentColor;border-radius:50%;background:#fff;cursor:pointer;flex:0 0 22px;display:inline-grid;place-items:center;transition:.15s}
  .circle-check:checked{border-color:var(--primary);background:var(--primary);color:#fff}
  .circle-check:checked::before{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .target-row.done .circle-check{border-color:var(--primary);background:var(--primary);color:#fff}
  .target-row.done .circle-check::before{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .target-row.done .target-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sc,var(--red));text-decoration-thickness:3px;text-decoration-skip-ink:none;opacity:.72}
  .today-card .gc-body .target-row .tr-inner{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .today-card .gc-body .row-actions{display:flex;gap:4px;flex:0 0 auto;margin-left:6px}
  .today-card .gc-body .icon-btn{width:30px;height:30px;border:none;background:transparent;border-radius:8px;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center;padding:0}
  .today-card .gc-body .icon-btn:hover{background:var(--line);color:var(--primary)}
  .today-card .gc-body .icon-btn.del:hover{color:var(--red)}
  .today-card .gc-body .target-row .row-actions .ico{width:16px;height:16px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
  .badge.overdue{background:var(--red-bg);color:var(--red)}
  .badge.rest{background:var(--amber-bg);color:var(--amber)}
  .badge.broken{background:var(--red-bg);color:var(--red)}
  .badge.done{background:var(--green-bg);color:var(--green)}
  .badge.normal{background:#eef0fb;color:var(--primary)}
  .stat-row{display:flex;gap:14px;margin:10px 0;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column}
  .stat .v{font-size:18px;font-weight:800}
  .stat .k{font-size:11px;color:var(--muted)}
  .plan{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px}
  .plan .pl{font-weight:700;color:var(--primary);margin-bottom:2px;display:flex;gap:6px;align-items:center}
  .plan .cm{color:var(--green);font-weight:600}
  .card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .suggest-box{display:flex;align-items:center;gap:10px;background:#f3f1ff;border-radius:12px;padding:10px 12px;margin:10px 0}
  .suggest-box .v{font-size:20px;font-weight:800;color:var(--primary)}
  .bar{height:8px;background:#edeef6;border-radius:999px;overflow:hidden;margin:8px 0}
  .bar>i{display:block;height:100%;background:var(--primary-grad);border-radius:999px}

  /* ring */
  .ring-wrap{display:flex;align-items:center;gap:14px}
  .ring{width:72px;height:72px;flex:0 0 72px}
  .ring-bg{stroke:#edeef6;stroke-width:7;fill:none}
  .ring-fg{stroke-width:7;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s}
  .ring-txt{font-size:15px;font-weight:800;fill:var(--text);text-anchor:middle}

  /* record list */
  .rec-list{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .rec{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .rec:last-child{border-bottom:none}
  .rec .tag{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:1px 5px}
  .rec .grow{flex:1}
  .rec .del{color:var(--muted);background:none;border:none;padding:2px}
  .rec .del:hover{color:var(--red)}

  /* chart */
  .chart-box{margin-top:8px;background:var(--surface-2);border-radius:12px;padding:10px}
  .chart-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .chart-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* banner */
  #banner-root .banner{background:linear-gradient(135deg,#fff7e6,#fff);border:1px solid #ffe2a8;
        border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:14px;box-shadow:var(--shadow)}
  #banner-root .banner .ico{color:var(--amber)}
  #banner-root .banner .grow{flex:1;font-size:14px}
  #banner-root .banner .x{background:none;border:none;color:var(--muted)}

  /* modal */
  #modal-root{position:fixed;inset:0;z-index:80;display:none}
  #modal-root.show{display:block}
  .modal-back{position:absolute;inset:0;background:rgba(20,22,40,.42);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(20,20,60,.3)}
  .modal h3{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
  .modal label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--text)}
  .modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;border:1.5px solid #b9b2de;
        border-radius:10px;background:var(--surface-2);color:var(--text)}
  .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,92,255,.14)}
  .modal input.qc-title{border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:700;padding:8px 10px;box-shadow:none;font-family:inherit}
  .modal input.qc-title:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,92,255,.14)}
  .modal textarea{resize:vertical;min-height:64px}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:8px;border:3px solid transparent;cursor:pointer}
  .sw.sel{border-color:var(--text)}
  .modal .close-x{position:absolute}
  .field-row{display:flex;gap:10px}
  .field-row>*{flex:1}
  .sub-list{margin-top:8px;font-size:12px;max-height:140px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .sub-list div{display:flex;gap:6px;padding:6px 8px;border-bottom:1px dashed var(--line);align-items:center}
  .sub-list div:last-child{border-bottom:none}
  .sub-list .sd{color:var(--muted)}
  .sub-list .x{margin-left:auto;color:var(--muted);background:none;border:none}

  /* weekly */
  .week-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
  .week-sum .box{background:var(--surface-2);border-radius:14px;padding:14px;text-align:center}
  .week-sum .box .v{font-size:22px;font-weight:800}
  .week-sum .box .k{font-size:12px;color:var(--muted)}
  .cmp{font-size:13px;margin-top:4px}
  .cmp.up{color:var(--green)} .cmp.down{color:var(--red)} .cmp.flat{color:var(--muted)}
  .four{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
  .four .col{background:var(--surface-2);border-radius:14px;padding:14px}
  .four .col h4{margin:0 0 8px;font-size:14px;display:flex;gap:6px;align-items:center}
  .report-out{width:100%;min-height:160px;margin-top:12px;font-family:inherit;font-size:13px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}

  /* mine */
  .mine-row{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:var(--surface)}
  .mine-row .ico{color:var(--primary)}
  .mine-row .grow{flex:1}
  .mine-row .grow b{display:block}
  .mine-row .grow span{font-size:12px;color:var(--muted)}
  .steps{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .step .n{width:26px;height:26px;border-radius:50%;background:var(--primary-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 26px}
  .section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1f2430;color:#fff;
         padding:10px 18px;border-radius:999px;font-size:13px;z-index:120;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;bottom:110px}

  /* confetti */
  #confetti-root{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
  .confetti-piece{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall 1.7s ease-in forwards}
  @keyframes fall{to{top:108%;transform:translateY(60vh) rotate(680deg);opacity:0}}
  .badge-money{display:inline-block;animation:badge-money-swing .8s ease-in-out infinite}
  .badge-amt{display:inline-block;animation:badge-amt-bounce .55s ease-in-out infinite}
  @keyframes badge-money-swing{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(14deg) translateY(-6px)}}
  @keyframes badge-amt-bounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-12px) scale(1.18)}60%{transform:translateY(4px) scale(.96)}80%{transform:translateY(-5px) scale(1.06)}}

  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .empty .big{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
  .pill-new{margin:18px 0;display:flex;justify-content:center}
  .danger-zone{margin-top:18px;border:1px solid var(--red-bg);background:var(--red-bg);border-radius:14px;padding:14px}
  .danger-zone h4{margin:0 0 8px;color:var(--red)}
  .row-inline{display:flex;gap:8px;align-items:center}
  .row-inline input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .manage-table th,.manage-table td{white-space:nowrap}
  @media(max-width:600px){.manage-table th:nth-child(4),.manage-table td:nth-child(4),.manage-table th:nth-child(5),.manage-table td:nth-child(5){display:none}}
  /* 全屏学习提醒 */
  .reminder-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 28%,#2a2350 0%,#120f24 70%);color:#fff;text-align:center;cursor:pointer;font-family:inherit;overflow:hidden}
  .reminder-overlay.show{display:flex}
  .reminder-inner{padding:26px;max-width:92vw;animation:remPop .5s cubic-bezier(.2,1.4,.3,1) both}
  @keyframes remPop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
  .reminder-label{font-size:clamp(15px,2.4vw,26px);opacity:.85;font-weight:600}
  .reminder-big{font-size:clamp(96px,22vw,300px);font-weight:900;line-height:.92;letter-spacing:-3px;text-shadow:0 8px 36px rgba(0,0,0,.45);animation:remBigPop .62s cubic-bezier(.2,1.5,.35,1) both}
  @keyframes remBigPop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
  .reminder-unit{font-size:clamp(18px,3vw,34px);font-weight:700;opacity:.92;margin-top:6px}
  .reminder-divider{height:2px;background:rgba(255,255,255,.18);width:min(72vw,540px);margin:24px auto}
  .reminder-phrase{font-size:clamp(15px,2.2vw,24px);opacity:.92;margin:20px 0 24px;font-weight:600}
  .reminder-btn{font-size:clamp(18px,2.6vw,28px);font-weight:800;padding:14px 38px;border:none;border-radius:999px;background:#7c5cff;color:#fff;cursor:pointer;box-shadow:0 12px 34px rgba(124,92,255,.5);font-family:inherit}
  .reminder-btn:active{transform:scale(.97)}
  .reminder-closehint{margin-top:22px;font-size:13px;opacity:.5}
  .reminder-bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:#7c5cff;transform-origin:left;box-shadow:0 0 14px rgba(124,92,255,.9);pointer-events:none;animation:remBar var(--bar,60s) linear forwards}
  @keyframes remBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  @keyframes remBeat{0%{transform:scale(1)}14%{transform:scale(calc(1 + var(--beat-amp,0.06)))}28%{transform:scale(1)}42%{transform:scale(calc(1 + var(--beat-amp,0.06)))}56%{transform:scale(1)}100%{transform:scale(1)}}
  .reminder-big.rem-beat{display:inline-block;animation:remBeat var(--beat-dur,1.2s) ease-in-out 1 both;will-change:transform}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div id="nav-exec-display" style="padding:14px 12px 10px;display:flex;align-items:center;gap:6px"></div>
  <button data-act="tab" data-tab="today" class="active"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M9 14l2 2 4-4"/></svg>今日</button>
  <button data-act="tab" data-tab="board"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/></svg>看板</button>
  <button data-act="tab" data-tab="week"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 19v-6M12 19v-9M16 19v-4"/></svg>周报</button>
  <button data-act="tab" data-tab="manage"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>任务管理</button>
  <button data-act="tab" data-tab="mine"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>我的</button>
</nav>

<div class="content">
  <div class="topbar"><h1>高考学习目标管理台</h1><span class="hint" id="today-label"></span></div>
  <div id="banner-root"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>

  高考学习目标管理台云端后端：Supabase → WorkBuddy Cloud（同源 jikaka-memory，免跨域预检）
    endpoint      = https://jikaka-memory.app.workbuddy.host
    publishableKey= wbpk_QuSSvKgXD7uP73LA5D5gNT_W0t84UkhE7UB0e9poO19fS9ZgJR6WlOP
  表映射：Supabase gaokao_state → WB Cloud gaokao_goal_state
    （独立表，避开记忆卡人档占用的 gaokao_state；RLS off + GRANT anon/authenticated）
  原理：动态加载 WB Cloud SDK（本地 vendor 优先 / CDN 兜底）→ 覆盖 window.fetch：
    凡命中 *.supabase.co/rest/v1/ 的请求翻译成 from().select()/upsert()，
    返回与 fetch 兼容的 { ok, status, json() }，页面同步代码零改动。
  一次性迁移：maybeMigrateLegacy() 经 window.__REAL_FETCH（原始 fetch）读旧 Supabase，
    legacy 比 WB Cloud 新时采纳并 force push 到 WB Cloud；每执行人一次，失败不留标记下轮重试。
  ⚠️ Origin 信任仅 CloudStudio 域名；GH Pages / Vercel 镜像打开时云端不可用（右下角角标提示），本地照常。
======================================================================================== -->
<script>
(function () {
  'use strict';
  window.GKWB_VER = '20261014a';
  var WB_CLOUD_CFG = {
    endpoint: 'https://jikaka-memory.app.workbuddy.host',
    publishableKey: 'wbpk_QuSSvKgXD7uP73LA5D5gNT_W0t84UkhE7UB0e9poO19fS9ZgJR6WlOP'
  };
  window.WB_CLOUD_CFG = WB_CLOUD_CFG;
  window.WB_READY = false;
  window.WB_DB = null;

  /* 表映射：supabase 表名 → { WB 表名, upsert 冲突列 } */
  var TABLE_MAP = { gaokao_state: { table: 'gaokao_goal_state', conflict: 'id' } };

  /* ---------- 1) SDK 载入（本地 vendor 优先，CDN 兜底） ---------- */
  (function loadSdk() {
    var srcs = [
      '../vendor/wbcloud-sdk.js',
      'https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js',
      'https://unpkg.com/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js'
    ];
    var i = 0;
    (function next() {
      if (typeof WorkBuddyCloud !== 'undefined') { initClient(); return; }
      if (i >= srcs.length) { window.__WB_SDK_FAIL = true; return; }
      var s = document.createElement('script');
      s.src = srcs[i++];
      s.onload = function () { if (typeof WorkBuddyCloud === 'undefined') { next(); } else { initClient(); } };
      s.onerror = function () { next(); };
      (document.head || document.documentElement).appendChild(s);
    })();
  })();

  function initClient() {
    try {
      var client = WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: WB_CLOUD_CFG.endpoint,
        publishableKey: WB_CLOUD_CFG.publishableKey
      });
      window.WB_DB = client.database;
      window.WB_READY = true;
    } catch (e) { window.__WB_SDK_FAIL = true; }
  }

  /* ---------- 2) 翻译层 ---------- */
  function waitWbReady(ms) {
    ms = ms || 12000;
    return new Promise(function (resolve) {
      if (window.WB_DB) return resolve(true);
      var n = 0, step = 200, max = Math.ceil(ms / step);
      var t = setInterval(function () {
        if (window.WB_DB) { clearInterval(t); return resolve(true); }
        if (window.__WB_SDK_FAIL || ++n >= max) { clearInterval(t); return resolve(false); }
      }, step);
    });
  }

  /* 右下角云状态角标：让用户即时看到云端是否可用（跨域拦截会立刻显现） */
  function showCloudBadge(state, detail) {
    try {
      var el = document.getElementById('wbCloudBadge');
      if (!el) {
        el = document.createElement('div');
        el.id = 'wbCloudBadge';
        el.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:99999;font:12px/1.5 system-ui,-apple-system,sans-serif;padding:6px 11px;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.18);max-width:280px;pointer-events:none;transition:opacity .3s';
        (document.body || document.documentElement).appendChild(el);
      }
      if (state === 'ok') { el.style.background = '#E6F4EA'; el.style.color = '#137333'; el.textContent = '☁ 已连接 WB Cloud'; }
      else if (state === 'wait') { el.style.background = '#FEF7E0'; el.style.color = '#B06000'; el.textContent = '☁ 连接云端中…'; }
      else { el.style.background = '#FCE8E8'; el.style.color = '#C5221F'; el.textContent = '⚠️ ' + (detail || '云端不可用'); }
    } catch (e) {}
  }
  function wbBadge(status) {
    if (status >= 200 && status < 300) showCloudBadge('ok');
    else if (status === 500) showCloudBadge('err', 'WB Cloud 拒绝写入');
    else showCloudBadge('err', '云端不可用（可能被跨域拦截，请用 CloudStudio 链接打开本页）');
  }

  /* 解析 supabase REST 查询串 → WB Cloud 构造器参数 */
  function parseQuery(search) {
    var cols = '*', eqs = [], order = null, limit = null;
    var params = new URLSearchParams(search);
    params.forEach(function (val, key) {
      if (key === 'select') { cols = val; }
      else if (key === 'order') { var a = val.split('.'); order = { col: a[0], asc: a[1] !== 'desc' }; }
      else if (key === 'limit') { limit = parseInt(val, 10) || null; }
      else {
        var m = val.match(/^(eq|ne|gt|gte|lt|lte|like|ilike|is|in|cs|cd|ov|fts)\.(.*)$/);
        if (m) { eqs.push({ col: key, op: m[1], val: m[2] }); }
        else { eqs.push({ col: key, op: 'eq', val: val }); }
      }
    });
    return { cols: cols, eqs: eqs, order: order, limit: limit };
  }

  function applyFilters(qb, eqs, order, limit) {
    eqs.forEach(function (f) {
      if (f.op === 'eq') qb = qb.eq(f.col, f.val);
      else if (f.op === 'in') { var v = f.val.replace(/^\(|\)$/g, '').split(','); qb = qb.in(f.col, v); }
      else if (f.op === 'cs' || f.op === 'cd' || f.op === 'ov') {
        try { qb = qb.contains(f.col, JSON.parse(f.val)); } catch (e) { qb = qb.contains(f.col, f.val); }
      } else qb = qb.filter(f.col, f.op, f.val);
    });
    if (order) qb = qb.order(order.col, { ascending: order.asc });
    if (limit) qb = qb.limit(limit);
    return qb;
  }

  function makeResp(data, status) {
    wbBadge(status);
    return {
      ok: (status >= 200 && status < 300),
      status: status || 200,
      json: function () { return Promise.resolve(data); }
    };
  }

  async function wbFetchRest(url, opts) {
    opts = opts || {};
    var method = (opts.method || 'GET').toUpperCase();
    var u; try { u = new URL(url); } catch (e) { return makeResp([], 400); }
    var m = u.pathname.match(/\/rest\/v1\/([^?/]+)/);
    if (!m) return makeResp([], 400);
    var table = m[1];
    var mapEntry = TABLE_MAP[table] || null;
    var wbTable = mapEntry ? mapEntry.table : table;
    var q = parseQuery(u.search);
    var ready = await waitWbReady(12000);
    if (!ready || !window.WB_DB) return makeResp([], 502);
    var db = window.WB_DB;
    try {
      if (method === 'GET') {
        var qb = db.from(wbTable).select(q.cols);
        qb = applyFilters(qb, q.eqs, q.order, q.limit);
        var r1 = await qb;
        if (r1.error) return makeResp([], 500);
        return makeResp(r1.data || [], 200);
      } else if (method === 'POST') {
        var rows = JSON.parse(opts.body || '[]');
        if (!Array.isArray(rows)) rows = [rows];
        var prefer = ((opts.headers && (opts.headers.Prefer || opts.headers.prefer)) || '').toString();
        if (/merge-duplicates/.test(prefer)) {
          /* upsert：映射表按映射冲突列，其余按主键 */
          var conflict = mapEntry ? mapEntry.conflict : undefined;
          var r2 = conflict
            ? await db.from(wbTable).upsert(rows, { onConflict: conflict })
            : await db.from(wbTable).upsert(rows);
          if (r2.error) return makeResp([], 500);
          return makeResp(r2.data || [], 201);
        }
        rows.forEach(function (row) { if (row && row.id == null) row.id = Date.now() + '-' + Math.random().toString(36).slice(2, 8); });
        var r3 = await db.from(wbTable).insert(rows);
        if (r3.error) return makeResp([], 500);
        return makeResp(r3.data || [], 201);
      } else if (method === 'DELETE') {
        var qbd = db.from(wbTable).delete();
        qbd = applyFilters(qbd, q.eqs, null, null);
        var r4 = await qbd;
        if (r4.error) return makeResp([], 500);
        return makeResp(r4.data || [], 200);
      } else if (method === 'PATCH' || method === 'PUT') {
        var patch = JSON.parse(opts.body || '{}');
        var qbu = db.from(wbTable).update(patch);
        qbu = applyFilters(qbu, q.eqs, null, null);
        var r5 = await qbu;
        if (r5.error) return makeResp([], 500);
        return makeResp(r5.data || [], 200);
      }
      return makeResp([], 405);
    } catch (e) {
      return makeResp([], 502);
    }
  }

  /* ---------- 3) 拦截 Supabase REST fetch → WB Cloud ---------- */
  if (typeof window.fetch === 'function') {
    var REAL_FETCH = window.fetch.bind(window);
    window.__REAL_FETCH = REAL_FETCH;   /* 供一次性迁移读旧 Supabase 用 */
    window.fetch = function (url, opts) {
      if (typeof url === 'string' && /supabase\.co\/rest\/v1\//.test(url)) {
        return wbFetchRest(url, opts);
      }
      return REAL_FETCH(url, opts);
    };
  }
})();

}

      {headers:{apikey:DEFAULT_CLOUD_KEY,Authorization:'Bearer '+DEFAULT_CLOUD_KEY}});
    if(!res||!res.ok)return; /* 旧云端不可达：不置标记，下次重试 */
    var rows=await res.json();
    if(!Array.isArray(rows)||!rows.length){localStorage.setItem(flag,'nolegacy');return;}
    var legacy=rows[0];
    var legacyUp=new Date(legacy.updated_at||0).getTime()||0;
    var wbMeta=await fetchCloudMeta();
    var wbUp=wbMeta?new Date(wbMeta).getTime()||0:0;
    if(legacyUp>wbUp&&(freshPreset||legacyUp>(S.updatedAt||0))){
      var payload=typeof legacy.data==='string'?JSON.parse(legacy.data):legacy.data;
      payload.updatedAt=legacyUp;
      S=migrate(payload);
      if(S.dailyTargetMins!=null){dailyTargetMins=Math.max(0,Number(S.dailyTargetMins)||0);try{localStorage.setItem(dailyKey(),String(dailyTargetMins));}catch(e){}}
      if(S.yuanPerMin!=null){yuanPerMin=Math.max(0,Number(S.yuanPerMin)||0);try{localStorage.setItem(yuanKey(),String(yuanPerMin));}catch(e){}}
      if(typeof S.affirmation==="string"){affirmation=S.affirmation;try{localStorage.setItem(affirmKey(),affirmation);}catch(e){}}
      S.updatedAt=legacyUp;setBaseUp(legacyUp);setCloudSyncAt(legacyUp);
      try{localStorage.setItem(curStoreKey(),JSON.stringify(S));}catch(e){}
      if(curTab)render();
      pushCloud(true); /* 强制写 WB Cloud，绕过推送保护（本地刚被 legacy 替换） */
      toast('☁ 已从旧云端迁移「'+(curCfg().name||'')+'」的数据');
    }
    localStorage.setItem(flag,'done');
  }catch(e){console.warn('legacy migrate failed:',e);}
}

/* ===================== 计算 ===================== */
function sumAmount(g){return g.records.reduce((a,r)=>a+r.amount,0);}
function amountOn(g,d){return g.records.filter(r=>r.date===d).reduce((a,r)=>a+r.amount,0);}
function todayTargets(g){return (g.subgoals||[]).filter(s=>s.date===viewDate&&s.subject===g.name);}
function remaining(g){return Math.max(0,(g.subgoals.length||0)-sumAmount(g));}
function completion(g){const total=g.subgoals.length||0;return total>0?Math.min(100,sumAmount(g)/total*100):0;}
function suggested(g,dateStr){
  const rem=remaining(g);if(rem<=0)return 0;
  let days=diffDays(dateStr,g.deadline)+1;if(days<1)days=1;
  return Math.ceil(rem/days);
}
function suggestedForCheckin(g,dateStr){
  let s=suggested(g,dateStr);
  if(dateStr===todayStr()){
    const y=addDays(todayStr(),-1);
    if(!amountOn(g,y)&&getRestDays(g).has(y))s+=suggested(g,y);
  }
  return s;
}
function getRestDays(g){
  const recSet=new Set(g.records.map(r=>r.date));
  const dates=[...recSet].sort();if(dates.length===0)return new Set();
  const start=dates[0],today=todayStr();const rest=new Set();
  let cur=start;
  while(cur<=today){
    const ws=weekStart(cur),we=addDays(ws,6);
    for(let i=0;i<7;i++){const d=addDays(ws,i);if(d<start||d>today)continue;if(!recSet.has(d)){rest.add(d);break;}}
    cur=addDays(we,1);
  }
  return rest;
}
function computeStreak(g){
  const recSet=new Set(g.records.map(r=>r.date));
  if(recSet.size===0)return 0;
  const start=[...recSet].sort()[0];const today=todayStr();
  const rest=getRestDays(g);
  let streak=0,d=today;
  while(d>=start){if(recSet.has(d)||rest.has(d)){streak++;d=addDays(d,-1);}else break;}
  return streak;
}
function estimate(g){
  const today=todayStr();let sum7=0;
  for(let i=0;i<7;i++){const d=addDays(today,-i);const a=amountOn(g,d);if(a>0)sum7+=a;}
  if(sum7<=0)return {status:"none"};
  const speed=sum7/7;const rem=remaining(g);
  if(rem<=0)return {status:"done"};
  const daysNeeded=rem/speed;let est=addDays(today,Math.ceil(daysNeeded));
  if(diffDays(g.deadline,est)>0)est=g.deadline;
  const cmp=diffDays(est,g.deadline);
  return {status:"ok",est,ahead:cmp>=0,days:Math.abs(cmp)};
}
function overdueDays(g){const t=todayStr();if(diffDays(g.deadline,t)>0&&remaining(g)>0)return diffDays(g.deadline,t);return 0;}
function todayStatus(g){
  const t=todayStr();
  const od=overdueDays(g);
  const y=addDays(t,-1);const yRec=amountOn(g,y)>0;
  let yMiss=null;if(!yRec){yMiss=getRestDays(g).has(y)?"rest":"broken";}
  return {overdue:od,status:yMiss};
}
function totalRecords(){return S.goals.reduce((a,g)=>a+g.records.length,0);}
function estText(est){
  if(est.status==="none")return "暂无推算";
  if(est.status==="done")return "已完成";
  const lbl=est.days===0?"准时":(est.ahead?"提前 "+est.days+"天":"拖后 "+est.days+"天");
  return est.est+" · "+lbl;
}

/* ---- Board ---- */
function ring(pct,color){
  const r=28,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg class="ring" viewBox="0 0 72 72"><circle class="ring-bg" cx="36" cy="36" r="${r}"/><circle class="ring-fg" cx="36" cy="36" r="${r}" stroke="${color}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 36 36)"/><text class="ring-txt" x="36" y="41">${Math.round(pct)}%</text></svg>`;
}
function stackedChart(){
  const T=todayStr();const days=[];for(let i=13;i>=0;i--)days.push(addDays(T,-i));
  const byDay={};days.forEach(d=>byDay[d]={});
  const subSet=new Set();
  S.goals.forEach(g=>g.records.forEach(r=>{if(r.minutes>0){const k=r.sub||"未分类";subSet.add(k);byDay[r.date][k]=(byDay[r.date][k]||0)+r.minutes;}}));
  const subs=[...subSet];
  const totals=days.map(d=>Object.values(byDay[d]).reduce((a,b)=>a+b,0));
  const max=Math.max(10,...totals);
  const W=days.length*20,H=130,pad=18;const bw=12;
  let bars="";
  days.forEach((d,i)=>{
    const x=pad+i*20+(20-bw)/2;const tot=totals[i];let y=H-22;
    if(tot>0){
      subs.forEach(k=>{const v=byDay[d][k]||0;if(v<=0)return;const h=v/max*(H-30);y-=h;const col=PALETTE[subs.indexOf(k)%PALETTE.length];bars+=`<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" fill="${col}" rx="2"><title>${d} ${esc(k)}: ${v}分钟</title></rect>`;});
    }
    bars+=`<text x="${x+bw/2}" y="${H-8}" font-size="8" fill="#9aa0b5" text-anchor="middle">${(+d.split("-")[2])}</text>`;
  });
  const legend=subs.map(k=>`<span><i style="background:${PALETTE[subs.indexOf(k)%PALETTE.length]}"></i>${esc(k)}</span>`).join("");
  return `<div class="chart-box"><div class="hint" style="margin-bottom:4px">近 14 天投入分钟 · 按子目标堆叠（未填分钟不计入）</div>
    <svg viewBox="0 0 ${W+pad*2} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${bars}</svg>
    <div class="chart-legend">${legend||'<span class="muted">暂无分钟记录</span>'}</div></div>`;
}
function boardCard(g){
  const comp=completion(g);const streak=computeStreak(g);const est=estimate(g);
  let estHtml;if(est.status==="none")estHtml="暂无推算";else if(est.status==="done")estHtml="已完成";
  else estHtml=`<span class="${est.ahead?'cmp up':'cmp down'}">${estText(est)}</span>`;
  const recs=g.records.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt).slice(0,10);
  const recHtml=recs.map(r=>`<div class="rec"><span class="tag" style="${r.isBackfill?'':'display:none'}">补</span><span class="grow">${r.date} · 打卡一次${r.minutes>0?' · '+r.minutes+'分':''}${r.sub?' · '+esc(r.sub):''}${r.wrongCount?(' · 错:'+esc(r.wrongType||'')+' +'+r.wrongCount):''}</span>${r.note?`<span class="sd muted">${esc(r.note)}</span>`:""}<button class="del" data-act="delrec" data-gid="${g.id}" data-rid="${r.id}" title="删除"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("");
  let plan="";
  if(g.obstacle||g.countermeasure)plan=`<div class="plan"><div class="pl"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M12 2l9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6z"/></svg>预案</div>${g.obstacle?`<div>障碍：${esc(g.obstacle)}</div>`:""}${g.countermeasure?`<div class="cm">对策：如果它出现，我就 ${esc(g.countermeasure)}</div>`:""}</div>`;
  return `<div class="card goal-card">
    <span class="accent" style="background:${g.color}"></span>
    <div class="ring-wrap">
      ${ring(comp,g.color)}
      <div style="flex:1">
        <h3 style="margin:0 0 4px">${esc(g.name)}</h3>
        <span class="unit">${sumAmount(g)}/${g.subgoals.length||0} 个子目标已完成 · 截止 ${g.deadline}</span>
        <div class="stat-row" style="margin:8px 0 0">
          <div class="stat"><span class="v">${streak}</span><span class="k">连续打卡</span></div>
          <div class="stat"><span class="v" style="font-size:13px">${estHtml}</span><span class="k">预计完成日</span></div>
          <div class="stat"><span class="v">${overdueDays(g)}</span><span class="k">逾期天数</span></div>
        </div>
      </div>
    </div>
    ${plan}
    <div class="rec-list"><div class="hint" style="margin-bottom:4px">最近记录（可删除）</div>${recHtml||'<div class="muted" style="font-size:13px">暂无记录</div>'}</div>
  </div>`;
}
function subjectDistribution(){
  const map={};
  S.goals.forEach(g=>g.records.forEach(r=>{if(r.minutes>0){map[g.name]=(map[g.name]||0)+r.minutes;}}));
  return Object.entries(map).map(([k,v])=>({name:k,val:v})).sort((a,b)=>b.val-a.val);
}
function subjectDistCard(){
  const arr=subjectDistribution();
  const total=arr.reduce((a,b)=>a+b.val,0);
  if(total===0)return "";
  let acc=0;const segs=arr.map((d,i)=>{const f=d.val/total*360;const from=acc;acc+=f;const col=PALETTE[i%PALETTE.length];return col+" "+from.toFixed(1)+"deg "+acc.toFixed(1)+"deg";}).join(", ");
  const legend=arr.map((d,i)=>`<span><i style="background:${PALETTE[i%PALETTE.length]}"></i>${esc(d.name)} ${d.val}分 (${(d.val/total*100).toFixed(0)}%)</span>`).join("");
  return `<div class="card" style="margin-top:14px"><div class="section-title" style="margin-bottom:8px">各科投入时间分布（全部记录合计）</div>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${segs});flex:0 0 140px;position:relative">
        <div style="position:absolute;inset:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="font-size:20px;font-weight:800;color:var(--primary)">${total}</div><div class="hint">总分钟</div></div>
      </div>
      <div class="chart-legend" style="flex:1;min-width:180px">${legend}</div>
    </div></div>`;
}
function renderBoard(){
  const main=document.getElementById("main");
  let html=`<h3 style="margin:0 0 4px;display:flex;align-items:center;gap:10px">看板<button class="btn primary sm" data-act="export-xlsx" title="导出当前执行人全部打卡记录为 Excel"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>导出 XLSX</button></h3><div class="hint" style="margin-bottom:14px">各科投入时间分布与进度环，下方为全部目标近 14 天投入分钟堆叠图。</div>`;

/* ---- Week ---- */
let weekCursor=null;
function weekMetrics(ws){
  const we=addDays(ws,6);let amt=0,days=new Set(),mins=0;
  S.goals.forEach(g=>g.records.forEach(r=>{if(r.date>=ws&&r.date<=we){amt+=r.amount;days.add(r.date);mins+=r.minutes;}}));
  return {amt,days:days.size,mins};
}
function weekSubjectStats(ws){
  const we=addDays(ws,6);const bySub={};let wrong=0,shortWrong=0,maxStreak=0,done=0,total=0;
  S.goals.forEach(g=>{
    maxStreak=Math.max(maxStreak,computeStreak(g));
    total+=g.subgoals.length||0;done+=sumAmount(g);
    g.records.forEach(r=>{if(r.date>=ws&&r.date<=we){if(r.minutes>0)bySub[g.name]=(bySub[g.name]||0)+r.minutes;if(r.wrongCount){wrong+=r.wrongCount;if((r.wrongType||"")==="短思维链错题")shortWrong+=r.wrongCount;}}});
  });
  let topSub="",topMin=0;Object.entries(bySub).forEach(([k,v])=>{if(v>topMin){topMin=v;topSub=k;}});
  return {topSub,topMin,wrong,shortWrong,maxStreak,done,total};
}

  const main=document.getElementById("main");

  const note=S.weeklyNotes[ws]||{keep:"",problem:"",attempt:"",plan:""};
  const wstats=weekSubjectStats(ws);
  const keepVal=(note.keep||"")?note.keep:`本周投入 ${cur.mins} 分钟、打卡 ${cur.days} 天${wstats.topSub?`，投入最多科目「${wstats.topSub}」(${wstats.topMin}分)`:''}；错题 ${wstats.wrong} 道（短思维链 ${wstats.shortWrong}）。`;
  const canPrev=prevWs>=weekStart(S.goals.length?S.goals.map(g=>g.records).flat().reduce((m,r)=>r.date<m?r.date:m,todayStr()):todayStr());
  let html=`<h3 style="margin:0 0 4px">周报</h3>
    <div class="row-inline" style="margin:10px 0">
      <button class="btn ghost sm" data-act="week-prev"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>上一周</button>
      <div class="grow" style="text-align:center;font-weight:700">${ws} ~ ${we}</div>
      <button class="btn ghost sm" data-act="week-next" ${ws>=weekStart(todayStr())?'disabled style="opacity:.4"':''}><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>下一周</button>
    </div>
    <div class="week-sum">
      <div class="box"><div class="v">${cur.amt}</div><div class="k">投入量（合计）</div><div class="cmp ${cur.amt>=prev.amt?'up':'down'}">环比 ${cmp(cur.amt,prev.amt)}</div></div>
      <div class="box"><div class="v">${cur.days}</div><div class="k">打卡天数</div><div class="cmp ${cur.days>=prev.days?'up':'down'}">环比 ${cur.days-prev.days>=0?'+':''}${cur.days-prev.days} 天</div></div>
      <div class="box"><div class="v">${cur.mins}</div><div class="k">分钟数</div><div class="cmp ${cur.mins>=prev.mins?'up':'down'}">环比 ${cmp(cur.mins,prev.mins)}</div></div>
    </div>
    <div class="four">
      <div class="col"><h4><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>保持</h4><textarea data-wn="keep" data-ws="${ws}" placeholder="这周做得好的…">${esc(keepVal)}</textarea></div>
      <div class="col"><h4><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>问题</h4><textarea data-wn="problem" data-ws="${ws}" placeholder="卡住我的…">${esc(note.problem)}</textarea></div>
      <div class="col"><h4><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3"/></svg>尝试</h4><textarea data-wn="attempt" data-ws="${ws}" placeholder="下周想试的…">${esc(note.attempt)}</textarea></div>

  main.innerHTML=html;

function genReport(ws){
  const we=addDays(ws,6);const cur=weekMetrics(ws);const prev=weekMetrics(addDays(ws,-7));
  const wstats=weekSubjectStats(ws);
  const note=S.weeklyNotes[ws]||{};
  const keepVal=note.keep||`本周投入 ${cur.mins} 分钟、打卡 ${cur.days} 天${wstats.topSub?`，投入最多科目「${wstats.topSub}」(${wstats.topMin}分)`:''}；错题 ${wstats.wrong} 道（短思维链 ${wstats.shortWrong}）。`;
  const cmp=(a,b)=>{if(b===0)return a===0?'持平':'—';return ((a-b)/b*100>=0?'+':'')+((a-b)/b*100).toFixed(0)+'%';};

· 尝试：${note.attempt||'—'}
· 下周预案：${note.plan||'—'}`;

}

      html+=`<tr style="border-top:1px solid var(--line)">
        <td style="padding:10px 6px"><input type="checkbox" class="mg-sub-sel" value="${esc(key)}"></td>
        <td style="padding:10px 6px;color:var(--muted)">${i+1}</td>
        <td style="padding:10px 6px;font-weight:600">${esc(s.sub)}</td>
        <td style="padding:10px 6px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${g.color};margin-right:6px"></span>${esc(g.name)}</td>
        <td style="padding:10px 6px;color:var(--muted)">${esc(s.material||'—')}</td>
        <td style="padding:10px 6px;text-align:right">${s.mins||0} 分</td>
        <td style="padding:10px 6px">${s.date}</td>
        <td style="padding:10px 6px;text-align:center;color:${checked>0?'var(--green)':'var(--muted)'}">${checked}</td>
        <td style="padding:10px 6px">
          <button class="btn ghost sm" data-act="edit-subgoal" data-gid="${g.id}" data-date="${s.date}" data-sub="${esc(s.sub)}" title="编辑"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16z"/></svg></button>
          <button class="btn ghost sm" data-act="del-subgoal" data-gid="${g.id}" data-date="${s.date}" data-sub="${esc(s.sub)}" title="删除"><svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
        </td>
      </tr>`;
    });
  }
  html+=`</tbody></table></div>`;
  main.innerHTML=html;
}

/* ===================== 全屏学习提醒 ===================== */
function todayCheckedMins(){const t=todayStr();let m=0;S.goals.forEach(g=>g.records.forEach(r=>{if(r.date===t)m+=(r.minutes||0);}));return m;}
function ensureReminderEl(){
  let el=document.getElementById("reminder");
  if(!el){el=document.createElement("div");el.id="reminder";el.className="reminder-overlay";el.setAttribute("data-act","reminder-close");document.body.appendChild(el);}
  return el;
}
function showReminder(){
  const t=todayStr();const gk=gaokaoDate();const toGk=diffDays(t,gk);
  const mins=todayCheckedMins();const remain=Math.max(0,dailyTargetMins-mins);const met=remain<=0;
  const phrase=REMIND_PHRASES[Math.floor(Math.random()*REMIND_PHRASES.length)];
  const el=ensureReminderEl();
  el.innerHTML=`<div class="reminder-inner">
    <div class="reminder-label">${esc(executorName)}，今天距离高考（${gk}）还有</div>
    <div class="reminder-big">${toGk}</div>
    <div class="reminder-unit">天</div>
    <div class="reminder-divider"></div>
    <div class="reminder-label">今日已打卡</div>
    <div class="reminder-big" id="reminder-mins" style="color:#4ade80;--beat-amp:${beatAmp};--beat-dur:${beatDur}s">${mins}</div>
    <div class="reminder-unit">分钟 · ${met?'今日目标已达成 🎉':'还差 '+remain+' 分钟达标'}</div>
    <div class="reminder-phrase">${esc(phrase)}</div>
    <button class="reminder-btn" data-act="reminder-start">开始学习 →</button>
    <div class="reminder-closehint">点击任意处或按 Esc 关闭 · ${remindCloseSec} 秒后自动关闭</div>
    <div class="reminder-bar" style="--bar:${remindCloseSec}s"></div>
  </div>`;
  el.classList.add("show");
  reminderOverlayOpen=true;lastReminderTs=Date.now();
  clearTimeout(reminderTimer);reminderTimer=setTimeout(closeReminder,remindCloseSec*1000);
  beatLoop(document.getElementById("reminder-mins"));
}
function beatLoop(el){
  if(!beatEnabled||!el)return;
  clearTimeout(beatTimer);
  el.classList.remove("rem-beat");
  void el.offsetWidth;
  el.classList.add("rem-beat");
  beatTimer=setTimeout(()=>beatLoop(el),beatPause*1000);
}
function closeReminder(){const el=document.getElementById("reminder");if(el)el.classList.remove("show");reminderOverlayOpen=false;clearTimeout(reminderTimer);clearTimeout(beatTimer);}
function startStudy(){closeReminder();curTab="today";render();const g=S.goals[0];if(g)openQuickCheckin(g.id);else toast("还没有目标，先去「任务管理」添加吧");}
function reminderTick(){
  if(!reminderEnabled||reminderOverlayOpen)return;
  const now=new Date();const m=now.getHours()*60+now.getMinutes();
  if(m<remindStartHour*60||m>=remindEndHour*60)return;                       // 时间窗口
  if(Date.now()-lastReminderTs<remindIntervalMin*60*1000)return;            // 至少间隔 N 分钟
  const t=todayStr();const cutoff=Date.now()-remindIntervalMin*60*1000;     // 智能跳过：N 分钟内刚打卡则不打扰
  if(S.goals.some(g=>g.records.some(r=>r.date===t&&r.createdAt&&r.createdAt>=cutoff)))return;
  showReminder();
}
function startReminder(){
  lastReminderTs=Date.now();                        // 启动后等满 5 分钟再首次弹出
  setInterval(reminderTick,20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)reminderTick();}); // 切回前台补检（应对后台节流）
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&reminderOverlayOpen)closeReminder();});
}
function autoRefreshTick(){
  if(!autoRefreshEnabled)return;
  const now=new Date();
  if(now.getHours()===0&&now.getMinutes()>=1&&now.getMinutes()<10){   // 00:01–00:09 窗口，防止定时器被后台节流错过
    const key="gaokao_auto_refresh_date";
    const today=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
    if(localStorage.getItem(key)!==today){
      localStorage.setItem(key,today);
      setTimeout(()=>location.reload(),1000);                          // 每天仅刷新一次
    }
  }
}
function startAutoRefresh(){setInterval(autoRefreshTick,30000);}

document.addEventListener("click",e=>{

  }

  }
  if(act==="save-yuan"){
    const v=Math.max(0,Number(document.getElementById("yuan-per-min").value)||0);
    setYuanPerMin(v);render();toast("每分钟奖励已保存为 "+yuanPerMin+" 元（"+executorName+"）");return;
  }
  if(act==="save-wallet"){
    setWallet({startDate:document.getElementById("wallet-start").value,startAmount:document.getElementById("wallet-amount").value});
    render();toast("累计钱包已更新");return;
  }
  if(act==="add-penalty"){
    openAddPenalty();return;
  }
  if(act==="save-penalty"){
    const date=document.getElementById("penalty-date").value||todayStr();
    const amount=Math.max(0,Number(document.getElementById("penalty-amount").value)||0);
    const reason=(document.getElementById("penalty-reason").value||"").trim();
    if(!amount){toast("请填写扣除金额");return;}
    S.wallet=S.wallet||{};
    S.wallet.penaltyList=S.wallet.penaltyList||[];
    S.wallet.penaltyList.push({date,amount,reason});
    save();closeModal();render();toast("已新增扣除："+date+" -¥"+amount.toFixed(2));return;
  }
  if(act==="del-penalty"){
    const i=Number(el.dataset.i);
    if(!S.wallet||!Array.isArray(S.wallet.penaltyList))return;
    const removed=S.wallet.penaltyList.splice(i,1)[0];
    save();render();toast("已删除扣除："+(removed&&removed.date));return;
  }
  if(act==="toggle-reminder"){setReminderEnabled(!reminderEnabled);render();toast("学习提醒已"+(reminderEnabled?"开启":"关闭"));return;}
  if(act==="toggle-dash"){setDashMode(!dashMode);render();toast("看板布局已"+(dashMode?"开启":"关闭"));return;}
  if(act==="toggle-beat"){setBeatEnabled(!beatEnabled);render();toast("心跳缩放已"+(beatEnabled?"开启":"关闭"));return;}
  if(act==="toggle-autorefresh"){setAutoRefreshEnabled(!autoRefreshEnabled);render();toast("每天 00:01 自动刷新已"+(autoRefreshEnabled?"开启":"关闭"));return;}
  if(act==="save-remind"){
    setRemindStartHour(document.getElementById("remind-start").value);
    setRemindEndHour(document.getElementById("remind-end").value);
    setRemindIntervalMin(document.getElementById("remind-interval").value);
    setRemindCloseSec(document.getElementById("remind-close").value);
    setBeatAmp(document.getElementById("beat-amp").value);
    setBeatDur(document.getElementById("beat-dur").value);
    setBeatPause(document.getElementById("beat-pause").value);
    render();toast("提醒设置已保存（间隔 "+remindIntervalMin+" 分钟，窗口 "+remindStartHour+":00–"+remindEndHour+":00，自动关闭 "+remindCloseSec+" 秒，心跳"+(beatEnabled?"强度 "+beatAmp+" / "+beatDur+" 秒，静止 "+beatPause+" 秒":"已关")+"）");return;
  }
  if(act==="toggle-push"){setPushEnabled(!pushEnabled);render();toast("打卡推送已"+(pushEnabled?"开启":"关闭"));return;}

    setPushFeishuEnabled(document.getElementById("push-feishu").checked);
    setPushPushplusEnabled(document.getElementById("push-pp").checked);
    setPushWebhook(document.getElementById("push-webhook").value);
    setPushFeishuWebhook(document.getElementById("push-feishu-hook").value);
    setPushToken(document.getElementById("push-token").value);
    setPushTopic(document.getElementById("push-topic").value);
    setPushSecret(document.getElementById("push-secret").value);
    setPushProxy(document.getElementById("push-proxy").value);
    const ch=[pushDingEnabled?'钉钉':'',pushFeishuEnabled?'飞书':'',pushPushplusEnabled?'微信':''].filter(Boolean).join('+')||'未选';
    render();toast("推送设置已保存（通道："+ch+"，"+(pushEnabled?"已开启":"未开启")+"）");return;
  }
  if(act==="push-test"){pushCheckinNotify();toast("已发送一条测试推送，请检查群消息（若未收到请检查 Webhook 与平台）");return;}
  if(act==="reminder-test"){showReminder();return;}

  if(act==="add-task-save"){

/* ---- 打卡记录导出 XLSX（零依赖：手写 zip store + sheet XML） ---- */
function crc32(buf){
  let c;const t=[];
  for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++)crc=t[(crc^buf[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function escXml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function colName(i){let s="";i+=1;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function xlsxSheetXml(rows){
  let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row,ri)=>{
    xml+='<row r="'+(ri+1)+'">';
    row.forEach((cell,ci)=>{
      xml+='<c r="'+colName(ci)+(ri+1)+'" t="inlineStr"><is><t xml:space="preserve">'+escXml(cell==null?"":cell)+'</t></is></c>';
    });
    xml+='</row>';
  });
  return xml+'</sheetData></worksheet>';
}
function buildZipStore(files){
  const enc=new TextEncoder();const chunks=[];const central=[];let offset=0;
  Object.keys(files).forEach(name=>{
    const data=typeof files[name]==="string"?enc.encode(files[name]):files[name];
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    const nb=enc.encode(name);
    chunks.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0,true);
    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);
    ch.setUint32(42,offset,true);
    central.push([ch,nb]);
    offset+=30+name.length+data.length;
  });
  const cdSize=central.reduce((a,c)=>a+(c[0].byteLength+c[1].length),0);
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true);eocd.setUint16(8,Object.keys(files).length,true);eocd.setUint16(10,Object.keys(files).length,true);
  eocd.setUint32(12,cdSize,true);eocd.setUint32(16,offset,true);eocd.setUint16(20,0,true);
  const parts=[];chunks.forEach(c=>parts.push(c));central.forEach(([dv,nb])=>{parts.push(new Uint8Array(dv.buffer),nb);});parts.push(new Uint8Array(eocd.buffer));
  const total=parts.reduce((a,b)=>a+b.length,0);const final=new Uint8Array(total);let p=0;
  parts.forEach(b=>{final.set(b,p);p+=b.length;});
  return final;
}
function exportRecordsXlsx(){
  const rows=[[ "执行人","日期","星期","学科","任务名称","时长(分钟)","错题类型","错题数量","备注","是否补卡","打卡时间" ]];
  S.goals.forEach(g=>{
    (g.records||[]).forEach(r=>{
      rows.push([executorName,r.date,"星期"+"日一二三四五六"[new Date(r.date).getDay()],g.name,r.sub||"",r.minutes||0,r.wrongType||"",r.wrongCount||0,r.note||"",r.isBackfill?"补卡":"正常",r.createdAt?new Date(r.createdAt).toLocaleString("zh-CN"):""]);
    });
  });
  rows.slice(1).sort((a,b)=>(a[1]||"").localeCompare(b[1]||""));
  if(rows.length===1){toast("还没有打卡记录");return;}
  const CT='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const RELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const WB='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="打卡记录" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const WB_RELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';
  const STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="1"><xf/></cellXfs></styleSheet>';
  const zip=buildZipStore({
    "[Content_Types].xml":CT,
    "_rels/.rels":RELS,
    "xl/workbook.xml":WB,
    "xl/_rels/workbook.xml.rels":WB_RELS,
    "xl/styles.xml":STYLES,
    "xl/worksheets/sheet1.xml":xlsxSheetXml(rows)
  });
  const blob=new Blob([zip],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=(executorName||"学习台")+"-打卡记录-"+todayStr()+".xlsx";a.click();URL.revokeObjectURL(url);
  toast("已导出 xlsx（"+executorName+"，"+(rows.length-1)+" 条记录）");
}
function celebrate(){
  if(celebrateLevel==="off")return;
  const root=document.getElementById("confetti-root");
  const colors=PALETTE.slice();
  let style=Math.floor(Math.random()*3);
  if(celebrateLevel==="light")style=0;
  const counts=[50,60,48];
  const n=celebrateLevel==="light"?22:counts[style];
  if(style===0){
    // falling strips
    for(let i=0;i<n;i++){
      const p=document.createElement("div");p.className="confetti-piece";
      p.style.left=(Math.random()*100)+"%";
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.width=(6+Math.random()*8)+"px";p.style.height=(12+Math.random()*16)+"px";
      p.style.borderRadius=(Math.random()*4)+"px";
      p.style.animationDelay=(Math.random()*0.4)+"s";
      p.style.animationDuration=(1.4+Math.random()*0.8)+"s";
      root.appendChild(p);setTimeout(()=>p.remove(),2400);
    }
  }else if(style===1){
    // burst from center
    const cx=50,cy=45;
    for(let i=0;i<n;i++){
      const p=document.createElement("div");p.className="confetti-piece";
      const angle=(Math.PI*2*i)/n+Math.random()*0.3;
      const dist=20+Math.random()*50;
      const tx=Math.cos(angle)*dist,ty=Math.sin(angle)*dist+30;
      p.style.left=cx+"%";p.style.top=cy+"%";
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.width=(5+Math.random()*7)+"px";p.style.height=(5+Math.random()*7)+"px";
      p.style.borderRadius="50%";
      p.style.transition="all 1s ease-out";
      p.style.opacity="1";
      root.appendChild(p);
      requestAnimationFrame(()=>{p.style.transform=`translate(${tx}vw,${ty}vh) scale(0)`;p.style.opacity="0";p.style.transform+=" rotate("+(Math.random()*360)+"deg)";}
      );setTimeout(()=>p.remove(),1100);
    }
  }else{
    // spin stars / diamonds
    for(let i=0;i<n;i++){
      const p=document.createElement("div");p.className="confetti-piece";
      p.style.left=(Math.random()*100)+"%";
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.width="10px";p.style.height="10px";
      p.style.clipPath="polygon(50% 0%,100% 50%,50% 100%,0% 50%)";
      p.style.animationDelay=(Math.random()*0.4)+"s";
      p.style.animationDuration=(1.5+Math.random()*0.7)+"s";
      root.appendChild(p);setTimeout(()=>p.remove(),2300);
    }
  }
}
function fireworks(){
  if(celebrateLevel==="off")return;
  const root=document.getElementById("confetti-root");
  const colors=PALETTE.slice();
  const centers=[[25,38],[60,33],[82,46],[45,56]];
  centers.forEach(c=>{
    const cx=c[0],cy=c[1];
    for(let i=0;i<22;i++){
      const p=document.createElement("div");p.className="confetti-piece";
      const angle=(Math.PI*2*i)/22;
      const dist=16+Math.random()*24;
      const tx=Math.cos(angle)*dist,ty=Math.sin(angle)*dist;
      p.style.left=cx+"%";p.style.top=cy+"%";
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.width=(4+Math.random()*5)+"px";p.style.height=(4+Math.random()*5)+"px";
      p.style.borderRadius="50%";
      p.style.transition="all 900ms ease-out";
      p.style.opacity="1";
      root.appendChild(p);
      requestAnimationFrame(()=>{p.style.transform=`translate(${tx}vw,${ty}vh) scale(0)`;p.style.opacity="0";});
      setTimeout(()=>p.remove(),1000);
    }
  });
}
function badgePop(txt){
  if(celebrateLevel==="off")return;
  const root=document.getElementById("confetti-root");
  const b=document.createElement("div");
  b.style.cssText="position:absolute;left:50%;top:46%;transform:translate(-50%,70px) scale(.7);opacity:0;display:flex;align-items:center;justify-content:center;gap:8px;color:#f59e0b;text-align:center;white-space:nowrap;text-shadow:0 2px 16px rgba(245,158,11,.55),0 0 44px rgba(251,191,36,.5);box-sizing:border-box";
  b.innerHTML=`<span class="badge-money" style="font-size:60px">💰</span><span class="badge-amt" style="font-size:56px;font-weight:900">${esc(txt||"+0 元")}</span>`;
  root.appendChild(b);
  requestAnimationFrame(()=>{b.style.transition="transform 330ms cubic-bezier(.2,1.4,.4,1),opacity 220ms ease-out";b.style.transform="translate(-50%,-50%) scale(1.06)";b.style.opacity="1";});
  setTimeout(()=>{b.style.transition="transform 150ms ease-out";b.style.transform="translate(-50%,-50%) scale(1)";},350);
  setTimeout(()=>{b.style.transition="transform 520ms ease-in,opacity 520ms ease-in";b.style.transform="translate(-50%,-110%) scale(.92)";b.style.opacity="0";},1450);
  setTimeout(()=>b.remove(),2050);
}
